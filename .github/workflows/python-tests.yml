
name: Python Cleaning Tests


on:
  push:
    branches:
      - feature/8-clean-airbnb-data
      - feature/30-airbnb-analytics-pipeline
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandas
        run: python -m pip install pandas

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Validate full Airbnb dataset
        run: python cleaning.py --input Airbnb_NYC.csv
      - name: Validate integrated analytics pipeline
        run: python run_analysis.py
